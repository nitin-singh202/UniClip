<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <title>Offline — Universal Clipboard AI</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
</head>
<body style="background: var(--bg-primary); color: var(--text-primary); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; text-align: center;">
  <div style="background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 2.5rem; max-width: 440px; width: 100%; box-shadow: var(--shadow-lg);">
    
    <div style="width: 64px; height: 64px; border-radius: var(--radius-md); background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.3); display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 1.5rem;">
      📡
    </div>

    <h1 style="font-size: 1.4rem; font-weight: 700; margin-bottom: 0.75rem; letter-spacing: -0.01em;">
      You are currently offline
    </h1>

    <p style="color: var(--text-secondary); font-size: 0.9rem; line-height: 1.5; margin-bottom: 1.75rem;">
      Universal Clipboard AI requires an active internet connection to synchronize clipboard history securely with your account and devices.
    </p>

    <button type="button" onclick="window.location.reload()" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.8rem 1rem; font-size: 0.95rem; border-radius: var(--radius-md); font-weight: 600;">
      🔄 Retry Connection
    </button>

    <div style="margin-top: 1.5rem; font-size: 0.78rem; color: var(--text-muted);">
      Reconnecting automatically once your network is restored...
    </div>
  </div>

  <script>
    // Auto-reload as soon as internet connection returns
    window.addEventListener("online", () => {
      window.location.reload();
    });
  </script>
</body>
</html>
